# 通过 pi-ai 适配器使用 OpenAI 模型（或任何 OpenAI 兼容端点）。
# 凭据来源（按优先级）：
#   1. --api-key CLI 参数
#   2. 本文件的 api_key（明文，注意安全：不要提交含真实 key 的文件）
#   3. 环境变量 OPENAI_API_KEY
# 使用：goaloop run ... --model-profile pi-ai-openai
name = "pi-ai-openai"
provider = "openai"
model = "gpt-4o"
cordis = "cordis/goaloop.pi-ai.cordis.yml"
api_key_env = "OPENAI_API_KEY"
# api_key = "sk-your-openai-key-here"   # 可选：直接写在配置中
